<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oneleap RP</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>🗺 Oneleap RP</h1>
        <p class="subtitle">San Andreas</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">💰 Баланс</div>
                <div class="stat-value" id="money">$0</div>
            </div>
            <div class="stat">
                <div class="stat-label">📍 Локация</div>
                <div class="stat-value" id="location">—</div>
            </div>
        </div>

        <div class="map-container">
            <h2>Карта штата</h2>
            <div id="map"></div>
        </div>

        <div class="locations-list">
            <h2>Локации</h2>
            <div id="locations"></div>
        </div>

        <button id="closeBtn" class="btn-primary">Закрыть</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
